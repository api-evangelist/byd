name: BYD
description: 'BYD Company Ltd. is a Chinese multinational manufacturing conglomerate headquartered
  in Shenzhen, founded in 1995 by Wang Chuanfu and publicly listed in Hong Kong (1211) and
  Shenzhen (002594). Originally a rechargeable-battery maker, BYD has grown into one of the
  world''s largest producers of new-energy vehicles (battery-electric and plug-in hybrid
  cars, buses, and trucks), power batteries (including the Blade Battery), consumer and
  automotive electronics, rail transit systems (SkyRail/SkyShuttle), forklifts, and solar
  and energy-storage products. It was surfaced as a portfolio company of hongshan and added
  to the API Evangelist network for enrichment; BYD is a hardware and manufacturing company
  and does not publish a public developer or API program.'
